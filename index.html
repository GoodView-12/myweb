<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉辰良景的个人博客</title>
  <style>
    html, body {
      min-height: 100%;
    }
    body {
      background-color: #fff0f6;
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    }
    .card {
      background-color: #ffd6e0;
      width: calc(100% - 32px);
      border-radius: 10px;
      margin: 8px 16px 0 16px;
      overflow: auto;
    }
    .card-text {
      float: left;
      width: 100%;
      text-align: center;
      padding-top: 32px;
      font-size: 28px;
      color: #6b2c44;
    }
    .card-desc {
      float: left;
      width: 100%;
      text-align: center;
      padding: 16px 24px 32px;
      font-size: 18px;
      color: #7b3852;
    }
    .btn {
      float: left;
      width: calc(50% - 24px);
      margin: 0 12px 32px;
      padding: 14px 0;
      border: none;
      border-radius: 8px;
      background-color: #f8b8cc;
      font-size: 17px;
      color: #551a38;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }
    .footer-text {
      float: left;
      width: 100%;
      text-align: center;
      padding: 40px 0 24px;
      font-size: 14px;
    }
    .footer-text a {
      color: #884860;
      text-decoration: none;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
    .hero-wrap {
      position: relative;
    }
    .hero-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .hero-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to bottom, transparent, #fff0f6);
    }

    /* 文章白色小卡片 */
    .article-card {
      float: left;
      width: calc(100% - 32px);
      margin: 16px;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #333;
      cursor: pointer;
    }
    .article-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .article-card .title {
      float: left;
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
    }
    .loading-tip {
      float: left;
      width: 100%;
      text-align: center;
      padding: 32px;
      color: #7b3852;
    }
  </style>
</head>
<body>
  <div class="hero-wrap">
    <img class="hero-image" src="https://goodview-12.github.io/myweb/image/hero_image_1.jpg">
  </div>

  <!-- 第一张粉色卡片 -->
  <div class="card">
    <div class="card-text">吉辰良景的个人博客</div>
    <div class="card-desc">你好。</div>
  </div>

  <!-- 第二张粉色卡片：文章列表容器 -->
  <div class="card" id="articleContainer">
    <div class="loading-tip">加载文章中…</div>
  </div>

  <!-- 第三张粉色卡片：在线项目 -->
  <div class="card">
    <div class="card-text">在线项目</div>
    <a class="btn" href="https://goodview-12.github.io/myweb/online/sudoku" target="_blank">数独</a>
    <a class="btn" href="https://goodview-12.github.io/myweb/online/tierlist" target="_blank">Tier List</a>
  </div>

  <div class="footer-text">
    <a href="https://github.com/goodview-12/myweb" target="_blank">前往 GitHub</a>
  </div>

  <script>
    const container = document.getElementById("articleContainer");
    
    const imgExts = ["jpg", "png", "webp"];

    // 获取可用封面图片 url
    async function getCover(name) {
      for (const ext of imgExts) {
        const url = `mdtext/${name}.${ext}`;
        const ok = await testImg(url);
        if (ok) return url;
      }
      // 全部找不到，返回占位图，你可以替换成自己的占位图
      return "https://picsum.photos/600/300";
    }

    // 测试图片是否可以加载
    function testImg(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    // 读取 md，提取标题
    async function getTitle(name) {
      const res = await fetch(`mdtext/${name}.md`);
      if (!res.ok) return "无标题";
      const text = await res.text();
      const firstLine = text.split("\n")[0].trim();
      if (firstLine.startsWith("# ")) {
        return firstLine.slice(2).trim();
      }
      return firstLine || "无标题";
    }

    // 渲染单篇文章卡片
    async function renderArticle(name) {
      const cover = await getCover(name);
      const title = await getTitle(name);

      const a = document.createElement("a");
      a.className = "article-card";
      a.href = `article.html?name=${encodeURIComponent(name)}`;
      a.target = "_blank";

      const img = document.createElement("img");
      img.src = cover;
      img.alt = title;

      const titleDiv = document.createElement("div");
      titleDiv.className = "title";
      titleDiv.innerText = title;

      a.appendChild(img);
      a.appendChild(titleDiv);
      container.appendChild(a);
    }

    // 入口，读取 mdlist.json
    async function init() {
      try {
        const res = await fetch("./mdlist.json");
        if (!res.ok) throw new Error("load list fail");
        const list = await res.json();
        container.innerHTML = "";
        for (const name of list) {
          await renderArticle(name);
        }
      } catch (e) {
        container.innerHTML = `<div class="loading-tip">暂无内容</div>`;
      }
    }

    init();
  </script>
</body>
</html>
