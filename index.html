<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉辰良景の博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f6, #ffe8ef);
            font-family: "Microsoft Yahei", sans-serif;
            padding: 0 20px 40px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .banner-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 18px 18px 0 0;
            overflow: hidden;
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-gradient {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to bottom, transparent, #fff0f6);
        }
        .card {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(10px);
            border-radius: 0 0 18px 18px;
            padding: 24px 30px 36px;
            box-shadow: 0 4px 16px rgba(220,140,165,0.15);
            margin-bottom: 24px;
        }
        .header {
            text-align: center;
        }
        h1 {
            color:#b84b70;
            font-size:32px;
            margin-bottom:8px;
        }
        .slogan {
            color:#d17894;
            font-size:16px;
            margin-bottom:24px;
        }
        .intro {
            color:#8c4c60;
            line-height:1.75;
            font-size:16px;
        }
        .tool-card {
            padding:22px;
            border-radius:16px;
            background:rgba(255,255,255,0.7);
            text-align:center;
            margin-bottom:24px;
        }
        .tool-card h3 {
            color:#b84b70;
            margin-bottom:10px;
        }
        .repo-card {
            padding:22px;
            border-radius:16px;
            background:rgba(255,255,255,0.7);
            text-align:center;
        }
        .repo-card h3 {
            color:#b84b70;
            margin-bottom:10px;
        }
        .tool-link {
            display:inline-block;
            padding:10px 22px;
            background:#e87a9a;
            color:#fff;
            text-decoration:none;
            border-radius:10px;
        }
        footer {
            text-align:center;
            margin-top:36px;
            color:#c27890;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner-wrap">
            <img class="banner-img" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=80" alt="风景头图">
            <div class="banner-gradient"></div>
        </div>

        <div class="card header">
            <h1>吉辰良景の博客</h1>
            <div class="slogan">这是副标题。</div>
            <p class="intro">
你好。
            </p>
        </div>

        <div class="tool-card">
            <h3>在线项目</h3>
            <a class="tool-link" href="sudoku.html">在线数独</a>
        </div>

        <div class="repo-card">
            <h3>下载项目</h3>
            <a class="tool-link" href="https://github.com/goodview-12/myweb" target="_blank">前往GitHub</a>
        </div>

        <footer>
            吉辰良景の博客
        </footer>
    </div>
</body>
</html>
