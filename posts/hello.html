<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/nav.css">
    <title>测试文章</title>
    <style>
        h1,h2{
            text-align: center;
        }    
        .content{
           margin-inline: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <h2>吉辰良景的博客</h2>
        <button onclick="btn_back()">
            返回
        </button>
    </nav>
    <br>
    <br>
    <h1>测试文章</h1>
    <br>
    <div class="content">
        <p>这是一篇用来测试用的文章</p>
    </div>
    <script>
        function btn_back(){
            if(history.length > 1){
                history.back
            }else{
                alert("无上一页，即将返回首页")
                location.href="../index.html"
            }
        }
    </script>
</body>
</html>
